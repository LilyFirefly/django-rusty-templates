djangofmt_corpus = { git = "https://github.com/UnknownPlatypus/djangofmt", rev = "25e16af2a8cdae65a5fc224ee7e313f4535e2e0a" }
dtl-lexer = { path = "../dtl-lexer" }

[lints]
workspace = true
