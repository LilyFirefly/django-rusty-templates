[package]
name = "dtl_benchmark"
edition.workspace = true
publish = false
rust-version.workspace = true
description = "DTL Micro-benchmarks"

[lib]
bench = false
test = false
doctest = false

[[bench]]
name = "slugify"
harness = false

[[bench]]
name = "lexer"
