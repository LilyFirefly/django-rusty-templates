# This workflow is based on the example provided by CodSpeedHQ
# See https://codspeed.io/docs/guides/how-to-benchmark-rust-code
name: CodSpeed Benchmarks

on:
  push:
    branches:
      - "main"
  pull_request:
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

permissions: # optional for public repositories
  contents: read # required for actions/checkout
  id-token: write # required for OIDC authentication with CodSpeed

env:
  UV_LOCKED: 1

# Cancel running jobs for the same workflow and branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"

      - name: Setup rust toolchain, cache and cargo-codspeed binary
        uses: moonrepo/setup-rust@v1.3.0
        with:
          channel: stable
          cache-target: release
          bins: cargo-codspeed

      - name: Build the benchmark target(s)
        # Built for every mode the action runs, which then sets `CODSPEED_RUNNER_MODE` for each run.
        run: cargo codspeed build --locked -m simulation,memory -p dtl_benchmark

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0

      - name: Install dependencies
        run: uv sync --dev

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v5.8.0
        with:
          mode: simulation,memory
          run: |
            cargo codspeed run -p dtl_benchmark
            uv run pytest tests/ --codspeed
