name: Rust

on:
  push:
    branches: main
  pull_request:

permissions: {}

env:
  CARGO_TERM_COLOR: always
  PYTHONPATH: ${{ github.workspace }}

# Cancel running jobs for the same workflow and branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["macos-latest", "ubuntu-latest", "windows-latest"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.14"
    - name: Install uv
      uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
    - name: Install dependencies
      run: uv sync
      env:
        UV_PROJECT_ENVIRONMENT: ${{ env.pythonLocation }}
    - name: Install cargo-binstall
      uses: cargo-bins/cargo-binstall@8a2045612414e945291083f820cd50b4d8fc2218  # v1.26.0
    - name: Install cargo-llvm-cov
      run: cargo binstall cargo-llvm-cov
    - name: Run tests
      run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        files: lcov.info
        fail_ci_if_error: true
