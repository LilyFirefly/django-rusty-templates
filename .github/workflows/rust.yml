name: Rust

on:
  push:
    branches: main
  pull_request:

permissions: {}

env:
  CARGO_TERM_COLOR: always
  PYTHONPATH: ${{ github.workspace }}
  UV_LOCKED: 1

# Cancel running jobs for the same workflow and branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["macos-latest", "ubuntu-latest", "windows-latest"]

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v7.1.0
      with:
        python-version: "3.14"
    - name: Install uv
      uses: astral-sh/setup-uv@v10.4.0
    - name: Install dependencies
      run: uv sync
      env:
        UV_PROJECT_ENVIRONMENT: ${{ env.pythonLocation }}
    - name: Install cargo-binstall
      uses: cargo-bins/cargo-binstall@v1.27.0
    - name: Install cargo-llvm-cov
      run: cargo binstall cargo-llvm-cov
    - name: Run tests
      run: cargo llvm-cov --locked --all-features --workspace --lcov --output-path lcov.info
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7.1.1
      with:
        files: lcov.info
        fail_ci_if_error: true
